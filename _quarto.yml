project:
  type: website
  output-dir: _site
  resources:
    - fugazi/**
    - publications/downloads/**
    - images/som-map.png

website:
  title: "Aaron R. Martin"
  site-url: https://aaron-martin-phd.dev
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: publications/index.qmd
        text: Publications and Data
      - href: bbl/index.qmd
        text: BBL Daily
      - href: ask/index.qmd
        text: Ask Aaron
      - href: homelab/index.qmd
        text: Homelab
      - href: fugazi/index.html
        text: Fugazi Live
      - href: about.qmd
        text: About

format:
  html:
    theme: cosmo
    css: [styles.css, bbl/boxscores.css]
    toc: false
    lang: en
    include-in-header:
      text: |
        <script data-goatcounter="https://aaron-martin-phd.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
        <script>
          // Wake the Ask Aaron container (Cloud Run scales to zero) once per visit,
          // so it is usually running by the time a visitor opens the Ask page.
          (function () {
            try {
              if (location.pathname.indexOf("/ask") === 0) return;
              if (sessionStorage.getItem("askPrewarmed")) return;
              sessionStorage.setItem("askPrewarmed", "1");
              fetch("https://ask-aaron-201418184721.europe-west3.run.app/", {mode: "no-cors", cache: "no-store"}).catch(function () {});
            } catch (e) {}
          })();
        </script>
        <script>
          // Resolve sections relative to the home link, including subdirectory previews.
          document.addEventListener("DOMContentLoaded", () => {
            const home = document.querySelector("#quarto-header .navbar-brand");
            if (!home) return;
            const siteRoot = new URL(".", home.href).pathname;
            const section = location.pathname.slice(siteRoot.length).split("/")[0];
            const themes = {
              publications: "publications",
              bbl: "bbl",
              ask: "ask",
              homelab: "homelab",
              "about.html": "about",
              about: "about"
            };
            document.documentElement.dataset.siteSection = themes[section] || "home";
          });
        </script>
