name: Deploy site

on:
  push:
    branches: [main]
  # Edition checks merges the editions PR with GITHUB_TOKEN, and a push
  # made with that token does not trigger push workflows, so it dispatches
  # this one explicitly after the merge.
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        run: bash scripts/install_quarto_ci.sh

      - name: Render
        run: |
          python scripts/build_bbl_archive.py
          quarto render

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" --jq '.total_count') || count=0
            if [[ "$count" == 1 ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::GitHub did not list $ARTIFACT_NAME within 60 seconds"
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
