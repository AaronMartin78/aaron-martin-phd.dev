name: Edition checks

on:
  push:
    branches: [editions]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate edition files
        run: |
          shopt -s nullglob
          files=(bbl/posts/*.qmd)
          if [ ${#files[@]} -eq 0 ]; then echo "no editions yet"; exit 0; fi
          python scripts/check_edition.py --check-links "${files[@]}"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site (build must succeed before a PR is offered)
        run: quarto render

      - name: Open or refresh the PR to main (manual approval gate)
        env:
          GH_TOKEN: ${{ github.token }}
        # An open PR is the only acceptable reason to skip creation. Any
        # other failure must fail the job: the old `|| echo` swallowed the
        # 2026-10-19 case where "Allow GitHub Actions to create and approve
        # pull requests" (Settings -> Actions -> General) was off and no PR
        # ever appeared.
        run: |
          open=$(gh pr list --base main --head editions --state open \
            --json number --jq length)
          if [ "$open" -ge 1 ]; then
            echo "PR already open; new commits are on it."
          else
            gh pr create --base main --head editions \
              --title "BBL editions" \
              --body "Automated editions. Checks and render passed; review and merge to deploy."
          fi
